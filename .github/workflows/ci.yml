name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build macOS app and DMG
        run: ./build-app.sh mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yi-mark-macos
          path: target/dist/*
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command "candle.exe" -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes
          }

      - name: Build Windows app, EXE and MSI
        run: ./build-app.sh win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yi-mark-windows
          path: target/dist/*
          if-no-files-found: error

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Linux app-image
        run: ./build-app.sh linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yi-mark-linux
          path: target/dist/*
          if-no-files-found: error
